<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Framepixl-Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>framepixl-Editor</h1>
    </div>
    <div class="actions">
      <label for="fileInput" class="btn secondary">Open Image</label>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button id="resetBtn" class="btn secondary" disabled>Reset</button>
      <button id="exportBtn" class="btn primary" disabled>Export PNG</button>
    </div>
  </header>

  <main class="workspace">
    <section class="stage" id="dropZone">
      <div class="empty-state" id="emptyState">
        <p>Drop an image here or click <strong>Open Image</strong></p>
        <span>Supports JPG, PNG, WebP</span>
      </div>
      <canvas id="canvas"></canvas>
    </section>

    <aside class="inspector">
      <div class="panel-group">
        <h3>Adjustments</h3>
        <div class="control">
          <div class="label-row">
            <label for="brightness">Brightness</label>
            <span id="brightnessVal">100%</span>
          </div>
          <input type="range" id="brightness" min="0" max="200" value="100" disabled>
        </div>

        <div class="control">
          <div class="label-row">
            <label for="contrast">Contrast</label>
            <span id="contrastVal">100%</span>
          </div>
          <input type="range" id="contrast" min="0" max="200" value="100" disabled>
        </div>

        <div class="control">
          <div class="label-row">
            <label for="saturate">Saturation</label>
            <span id="saturateVal">100%</span>
          </div>
          <input type="range" id="saturate" min="0" max="200" value="100" disabled>
        </div>

        <div class="control">
          <div class="label-row">
            <label for="grayscale">Grayscale</label>
            <span id="grayscaleVal">0%</span>
          </div>
          <input type="range" id="grayscale" min="0" max="100" value="0" disabled>
        </div>

        <div class="control">
          <div class="label-row">
            <label for="sepia">Sepia</label>
            <span id="sepiaVal">0%</span>
          </div>
          <input type="range" id="sepia" min="0" max="100" value="0" disabled>
        </div>

        <div class="control">
          <div class="label-row">
            <label for="blur">Blur</label>
            <span id="blurVal">0px</span>
          </div>
          <input type="range" id="blur" min="0" max="20" value="0" step="0.5" disabled>
        </div>
      </div>

      <div class="panel-group">
        <h3>Frame & Transform</h3>
        <div class="control">
          <div class="label-row">
            <label for="frameWidth">Border Size</label>
            <span id="frameWidthVal">0px</span>
          </div>
          <input type="range" id="frameWidth" min="0" max="80" value="0" disabled>
        </div>

        <div class="control inline">
          <label for="frameColor">Border Color</label>
          <input type="color" id="frameColor" value="#ffffff" disabled>
        </div>

        <div class="btn-grid">
          <button id="rotateLeft" class="btn secondary" disabled>Rotate -90°</button>
          <button id="rotateRight" class="btn secondary" disabled>Rotate +90°</button>
          <button id="flipH" class="btn secondary" disabled>Flip X</button>
          <button id="flipV" class="btn secondary" disabled>Flip Y</button>
        </div>
      </div>

      <div class="panel-group">
        <h3>Presets</h3>
        <div class="presets">
          <button class="chip" data-preset="none" disabled>Clean</button>
          <button class="chip" data-preset="noir" disabled>Noir</button>
          <button class="chip" data-preset="warm" disabled>Kodak</button>
          <button class="chip" data-preset="fade" disabled>Matte</button>
        </div>
      </div>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
