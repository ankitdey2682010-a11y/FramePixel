<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FramePixel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1><span class="logo">■</span> FramePixel</h1>

```
  <div class="header-actions">
    <label>Canvas
      <select id="canvas-size">
        <option value="16">16 × 16</option>
      </select>
    </label>

    <button id="export-button" class="primary">
      Export spritesheet
    </button>
  </div>
</header>

<main class="workspace">
  <aside class="panel tools-panel">
    <section>
      <h2>Tools</h2>

      <div class="tools">
        <button class="tool active" data-tool="pencil">✏️</button>
        <button class="tool" data-tool="eraser">🧹</button>
      </div>
    </section>

    <section>
      <h2>Color</h2>
      <input id="color-picker" type="color" value="#202020">
      <div id="palette" class="palette"></div>
    </section>

    <section>
      <h2>Display</h2>
      <label class="check">
        <input id="show-grid" type="checkbox" checked>
        Show grid
      </label>
    </section>
  </aside>

  <section class="drawing-area">
    <div class="canvas-wrap">
      <canvas id="drawing-canvas" width="384" height="384"></canvas>
      <canvas id="grid-canvas" width="384" height="384"></canvas>
    </div>
  </section>

  <aside class="panel preview-panel">
    <section>
      <h2>Preview</h2>

      <div class="preview-box">
        <canvas id="preview-canvas" width="16" height="16"></canvas>
      </div>

      <button id="play-button">Pause</button>

      <label class="speed-label">
        Speed: <span id="speed-value">8</span> FPS
        <input id="speed" type="range" min="1" max="24" value="8">
      </label>
    </section>
  </aside>
</main>

<footer class="timeline">
  <div class="timeline-heading">
    <h2>Frames</h2>
    <button id="add-frame">+ Add frame</button>
  </div>

  <div id="frames" class="frames"></div>
</footer>

</body>
</html>
